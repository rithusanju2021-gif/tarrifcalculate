# ============================================================
# Render Blueprint for Rithish Tours & Travels Calculator Backend
# Free Web Service Deployment (Python 3.12 + Django 5)
# ============================================================
services:
  - type: web
    name: rtt-tariff-api
    runtime: python
    region: singapore  # Closest free tier region to India
    plan: free
    rootDir: backend
    buildCommand: "./build.sh"
    startCommand: "gunicorn config.wsgi:application --bind 0.0.0.0:$PORT --workers 2 --threads 4 --timeout 120 --log-file -"
    healthCheckPath: "/api/health/"
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.0
      - key: DEBUG
        value: "False"
      - key: SECRET_KEY
        generateValue: true
      - key: ALLOWED_HOSTS
        value: ".onrender.com,localhost,127.0.0.1"
      - key: CORS_ALLOWED_ORIGINS
        value: "http://localhost:5173"  # Update with your Vercel URL after deploying frontend
      - key: CSRF_TRUSTED_ORIGINS
        value: "http://localhost:5173"  # Update with your Vercel URL after deploying frontend
      # Optional: Aiven MySQL connection (set in Render Dashboard)
      # - key: DB_HOST
      #   sync: false
      # - key: DB_PORT
      #   value: "28761"
      # - key: DB_NAME
      #   value: "defaultdb"
      # - key: DB_USER
      #   value: "avnadmin"
      # - key: DB_PASSWORD
      #   sync: false
